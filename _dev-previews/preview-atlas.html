<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spot — protótipo Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0B1620; --surf:#101C24; --elev:#16232A;
  --ink:#EAE7E0; --ink2:#B4BCBF; --ink3:#879499;
  --borda:rgba(234,231,224,.15); --borda2:rgba(234,231,224,.09);
  --terra:#c1552f; --terra2:#E0714A;
  --verde:#2F5D62; --verdeTxt:#8FD3CE; --ambar:#BFA474;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--dark);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;max-width:430px;margin:0 auto;position:relative}
.mono{font-family:'IBM Plex Mono',monospace}
svg{display:block}
button,a{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;text-decoration:none}

.tela{position:fixed;inset:0;max-width:430px;margin:0 auto;background:var(--dark);display:none;flex-direction:column;overflow:hidden}
.tela.on{display:flex;animation:entra .26s ease}
@keyframes entra{from{opacity:0}}
.rola{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rola::-webkit-scrollbar{display:none}

/* nav */
.nav{position:fixed;left:13px;right:13px;bottom:14px;max-width:404px;margin:0 auto;height:66px;border-radius:24px;background:rgba(11,22,32,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--borda2);display:flex;padding:6px;gap:2px;box-shadow:0 12px 32px rgba(0,0,0,.42);z-index:60}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;color:var(--ink3);transition:background .15s}
.nav-i.on{background:rgba(193,85,47,.16);color:var(--ink)}
.nav-i span{font-size:10.5px}
.nav-i.on span{font-weight:600}
.nav-i:active{transform:scale(.94)}

/* ── VIAGENS ── */
.mapa{position:absolute;top:0;left:0;right:0;height:330px;z-index:0;
  background:
    radial-gradient(circle at 30% 42%, rgba(193,85,47,.30), transparent 46%),
    radial-gradient(circle at 78% 28%, rgba(47,93,98,.38), transparent 44%),
    radial-gradient(rgba(234,231,224,.26) .9px, transparent 1.1px) 0 0/9px 9px,
    var(--dark)}
.mapa::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,22,32,0) 38%,var(--dark) 100%)}
.topo{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 0}
.marca{font-family:'Cinzel',Georgia,serif;font-weight:500;font-size:17px;letter-spacing:.2em}
.av{width:34px;height:34px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#cfe9e6}
.placar{position:relative;z-index:5;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;padding:150px 24px 0}
.placar b{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:30px;letter-spacing:-.03em}
.placar i,.placar u{font-family:'IBM Plex Mono',monospace;font-style:normal;text-decoration:none;color:var(--ink3)}
.placar i{font-size:13px}.placar u{font-size:11px;letter-spacing:.06em}
.ponto{color:rgba(234,231,224,.28);font-size:11px}
.chips{position:relative;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:20px 24px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:100px;border:1px solid rgba(234,231,224,.2);color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
.filme{position:relative;z-index:5;display:flex;gap:12px;overflow-x:auto;padding:18px 24px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.filme::-webkit-scrollbar{display:none}
.card{flex:none;width:250px;height:330px;border-radius:20px;overflow:hidden;position:relative;scroll-snap-align:start;transition:transform .15s}
.card:active{transform:scale(.98)}
.card .g{position:absolute;inset:0}
.card .s{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,0) 0%,rgba(11,22,32,.55) 58%,var(--dark) 100%)}
.card .bd{position:absolute;top:16px;left:16px;font-size:26px}
.card .pe{position:absolute;left:18px;right:18px;bottom:18px;text-align:left}
.card .pe h3{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:32px;line-height:1;margin:0;color:#fff;letter-spacing:-.01em}
.card .pe p{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);margin:8px 0 0}
.pag{position:relative;z-index:5;display:flex;gap:5px;padding:2px 24px 0}
.pag i{display:block;height:3px;border-radius:2px;background:rgba(234,231,224,.3);width:8px;transition:width .2s,background .2s}
.pag i.on{width:18px;background:var(--ink)}
.fab{position:fixed;right:24px;bottom:100px;width:56px;height:56px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(193,85,47,.35);z-index:55}
.fab:active{transform:scale(.94)}

/* cabeçalho com foto (viagem / cidade) */
.hero{position:relative;height:230px;flex:none}
.hero .g{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,22,32,.3) 0%,rgba(11,22,32,0) 30%,rgba(11,22,32,.9) 82%,var(--dark))}
.hero .txt{position:absolute;left:24px;right:24px;bottom:18px;z-index:3}
.hero .txt .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.hero .txt h2{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:34px;line-height:1.04;margin:7px 0 0;color:#fff;letter-spacing:-.02em}
.volta{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:20px;z-index:6;width:36px;height:36px;border-radius:50%;background:rgba(11,22,32,.5);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.corpo{padding:20px 24px 130px}
.secao{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px}

/* linha de cidade */
.cid{display:block;width:100%;text-align:left;border:1px solid var(--borda);border-radius:16px;background:var(--elev);padding:15px 16px;margin-bottom:10px;transition:transform .15s}
.cid:active{transform:scale(.99)}
.cid h4{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:21px;margin:0;letter-spacing:-.01em}
.cid .m{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}

/* linha de spot */
.linha{display:flex;gap:13px;align-items:stretch;width:100%;text-align:left;border:1px solid var(--borda);border-radius:16px;background:var(--elev);overflow:hidden;margin-bottom:10px;transition:transform .15s}
.linha:active{transform:scale(.99)}
.linha .th{width:78px;flex:none}
.linha .co{flex:1;min-width:0;padding:13px 14px 13px 0}
.linha .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.linha h4{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:19px;margin:4px 0 0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha q{display:block;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:13.5px;line-height:1.4;color:var(--ink2);margin-top:6px;quotes:'\201C' '\201D';overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* abas de categoria */
.catabas{display:flex;gap:7px;overflow-x:auto;padding:0 0 16px;scrollbar-width:none}
.catabas::-webkit-scrollbar{display:none}
.catab{flex:none;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;border-radius:100px;border:1px solid rgba(234,231,224,.2);color:var(--ink2);white-space:nowrap}
.catab.on{background:var(--ink);border-color:var(--ink);color:var(--dark);font-weight:500}

/* ── SPOT ── */
#spot{position:relative}
.foto{position:absolute;inset:0;z-index:0}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,22,32,.35) 0%,rgba(11,22,32,0) 22%,rgba(11,22,32,.2) 40%,rgba(11,22,32,.92) 58%,var(--dark) 74%)}
.sp-topo{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.st-chip{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;border-radius:100px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.st-been{background:rgba(78,148,144,.24);border:1px solid rgba(78,148,144,.55);color:var(--verdeTxt)}
.st-want{background:rgba(191,164,116,.24);border:1px solid rgba(191,164,116,.55);color:#DDCBA4}
.st-skip{background:rgba(234,231,224,.1);border:1px solid rgba(234,231,224,.3);color:var(--ink2)}
.sp-rola{position:relative;z-index:6;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;scrollbar-width:none}
.sp-rola::-webkit-scrollbar{display:none}
.sp-baixo{padding:0 26px 120px}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.sp-nome{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:34px;line-height:1.02;letter-spacing:-.02em;color:#fff;margin:8px 0 0}
.div-nota{display:flex;align-items:center;gap:10px;margin-top:18px}
.div-nota span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra2);flex:none}
.div-nota i{flex:1;height:1px;background:rgba(234,231,224,.2)}
.nota{font-family:'Fraunces',Georgia,serif;font-size:23px;line-height:1.32;color:var(--ink);margin:11px 0 0;text-wrap:pretty}
.social{display:flex;align-items:center;gap:10px;margin-top:16px}
.pilha{display:flex;flex:none}
.pilha b{width:24px;height:24px;border-radius:50%;border:2px solid var(--dark);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:400;color:#cfe9e6}
.pilha b:first-child{margin-left:0}
.social p{margin:0;font-size:13px;color:var(--ink2);flex:1;min-width:0}
.social p i{font-style:normal;font-weight:600;color:var(--ink)}
.social u{text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);white-space:nowrap;flex:none}
.acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.acoes button{height:46px;border-radius:12px;background:rgba(234,231,224,.08);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:500}
.acoes button:active{transform:scale(.97)}
.seg{display:flex;gap:4px;background:rgba(234,231,224,.06);border-radius:12px;padding:4px;margin-top:14px}
.seg button{flex:1;padding:11px 0;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink3);transition:background .15s,color .15s}
.seg button.on{background:var(--elev);font-weight:600}
.aval{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.aval span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.estrelas{display:flex;gap:3px}

/* ── AMIGOS ── */
.am-topo{display:flex;align-items:center;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top,0px)) 24px 0;flex:none}
.am-topo h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em}
.mais{width:40px;height:40px;border-radius:50%;border:1px solid rgba(234,231,224,.2);display:flex;align-items:center;justify-content:center}
.abas{display:flex;gap:4px;background:rgba(234,231,224,.06);border-radius:12px;padding:4px;margin:18px 24px 0;flex:none}
.abas button{flex:1;padding:10px 0;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink3);display:flex;align-items:center;justify-content:center;gap:6px}
.abas button.on{background:var(--elev);font-weight:600;color:var(--ink)}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--terra);color:#fff;border-radius:100px;padding:1px 6px}
.feed{padding:18px 24px 130px;display:flex;flex-direction:column;gap:14px}
.fcard{border-radius:20px;background:var(--elev);border:1px solid var(--borda);overflow:hidden;text-align:left;width:100%;transition:transform .15s}
.fcard:active{transform:scale(.99)}
.fcard .im{height:186px;position:relative}
.fcard .im .g{position:absolute;inset:0}
.fcard .im::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,22,32,0) 38%,rgba(11,22,32,.88))}
.quem{position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:center;gap:8px;background:rgba(11,22,32,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:100px;padding:5px 12px 5px 5px}
.quem b{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:400;color:#cfe9e6}
.quem span{font-size:12.5px}
.quem span i{font-style:normal;font-weight:600}
.quando{position:absolute;top:19px;right:14px;z-index:3;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink2)}
.im .pe{position:absolute;left:16px;right:16px;bottom:14px;z-index:3}
.im .pe span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.im .pe h3{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:26px;color:#fff;margin:4px 0 0;line-height:1.05}
.fcorpo{padding:14px 16px 16px}
.fcorpo q{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:17px;line-height:1.35;quotes:'\201C' '\201D'}
.flinha{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.salvar{background:var(--terra);color:#fff;font-size:12.5px;font-weight:600;border-radius:100px;padding:9px 15px}
.salvar.feito{background:rgba(78,148,144,.24);border:1px solid rgba(78,148,144,.55);color:var(--verdeTxt)}
.fcoment{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%}
.fcoment b{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#cfe9e6}
.fcoment p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.fcoment p i{font-style:normal;font-weight:600;color:var(--ink)}

.vazio{padding:80px 32px;text-align:center;color:var(--ink3);font-size:14px;line-height:1.6}
.aviso{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--terra);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-align:center;padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s}
.aviso.on{transform:none}
</style>
</head>
<body>

<div class="tela on" id="viagens">
  <div class="mapa"></div>
  <div class="rola">
    <div class="topo"><div class="marca">SPOT</div><div class="av">LP</div></div>
    <div class="placar">
      <b>23</b><i>/195 países</i>
      <span class="ponto">·</span><u id="nSpots">48 spots</u>
      <span class="ponto">·</span><u id="nCid">19 cidades</u>
    </div>
    <div class="chips" id="chips"></div>
    <div class="filme" id="filme"></div>
    <div class="pag" id="pag"></div>
    <div style="height:130px"></div>
  </div>
  <div class="fab" onclick="toast('No app real: abre a escolha de categoria')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
</div>

<div class="tela" id="viagem">
  <button class="volta" onclick="voltar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="rola">
    <div class="hero"><div class="g" id="vgHero"></div><div class="txt"><div class="k" id="vgK"></div><h2 id="vgNome"></h2></div></div>
    <div class="corpo"><p class="secao">Cidades</p><div id="vgCidades"></div></div>
  </div>
</div>

<div class="tela" id="cidade">
  <button class="volta" onclick="voltar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="rola">
    <div class="hero"><div class="g" id="cdHero"></div><div class="txt"><div class="k" id="cdK"></div><h2 id="cdNome"></h2></div></div>
    <div class="corpo"><div class="catabas" id="cdAbas"></div><div id="cdLista"></div></div>
  </div>
</div>

<div class="tela" id="spot">
  <div class="foto" id="spFoto"></div>
  <div class="sp-topo">
    <button class="volta" style="position:static" onclick="voltar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="st-chip" id="spChip" onclick="ciclarStatus()"></button>
  </div>
  <div class="sp-rola">
    <div class="sp-baixo">
      <div class="kicker" id="spK"></div>
      <h2 class="sp-nome" id="spNome"></h2>
      <div class="div-nota"><span id="spDono">Minha nota</span><i></i></div>
      <p class="nota" id="spNota"></p>
      <div class="social" id="spSocial"></div>
      <div class="acoes">
        <button onclick="toast('Abre o telefone')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg>Ligar</button>
        <button onclick="toast('Abre o Instagram do lugar')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/></svg>Instagram</button>
        <button onclick="toast('Abre o Google Maps')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.4 7-11a7 7 0 10-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Maps</button>
      </div>
      <div class="seg" id="spSeg"></div>
      <div class="aval"><span>Minha avaliação</span><div class="estrelas" id="spEstrelas"></div></div>
    </div>
  </div>
</div>

<div class="tela" id="amigos">
  <div class="am-topo"><h1>Amigos</h1><button class="mais" onclick="toast('Adicionar por username ou link')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.4"/><path d="M3.5 20c0-3.6 2.9-6 6.5-6 1.4 0 2.7.36 3.7 1"/><path d="M18 14v6M15 17h6"/></svg></button></div>
  <div class="abas" id="amAbas"></div>
  <div class="rola"><div class="feed" id="amFeed"></div></div>
</div>

<div class="tela" id="explorar">
  <div class="rola"><div class="vazio">Explorar<br><span style="font-size:12.5px">Fora do escopo deste protótipo.</span></div></div>
</div>
<div class="tela" id="perfil">
  <div class="rola"><div class="vazio">Perfil<br><span style="font-size:12.5px">Fora do escopo deste protótipo.</span></div></div>
</div>

<div class="nav" id="nav"></div>
<div class="aviso" id="aviso"></div>

<script>
const G={
  terra:'linear-gradient(150deg,#8a5340,#c1552f 58%,#4a2f26)',
  mar:'linear-gradient(150deg,#25596b,#2F5D62 58%,#14262c)',
  ouro:'linear-gradient(150deg,#6b5535,#A9915F 58%,#3a2f1d)',
  vinho:'linear-gradient(150deg,#5c2f38,#8a3d4a 58%,#2e1a20)',
  verdeM:'linear-gradient(150deg,#35553a,#4c7a52 58%,#1d2c20)'
};
const CATS=['Todos','Comer & Beber','Onde ficar','Experiência','Compras'];
const VIAGENS=[
  {id:'pt',pais:'Portugal',bd:'🇵🇹',reg:'Europa',g:G.terra,cidades:[
    {nome:'Lisboa',g:G.terra,spots:[
      {n:'Cervejaria Ramiro',c:'Comer & Beber',g:G.terra,st:'been',r:5,nota:'Camarão à guilho e o prego no pão no fim. Fila de 40 minutos que eu faria de novo.',com:[['MC','#2F5D62'],['TV','#6b5535']]},
      {n:'Time Out Market',c:'Comer & Beber',g:G.ouro,st:'been',r:4,nota:'Vai com fome e sem plano. Melhor no almoço de semana, no fim de semana não dá pra andar.'},
      {n:'Memmo Alfama',c:'Onde ficar',g:G.mar,st:'want',r:0,nota:'Piscina virada pro rio. Guardei pra próxima.'}]},
    {nome:'Porto',g:G.vinho,spots:[
      {n:'Livraria Lello',c:'Experiência',g:G.vinho,st:'been',r:4,nota:'Cheia, cara, e ainda assim linda. Compra o ingresso antes e vai na primeira hora.'},
      {n:'Taberna dos Mercadores',c:'Comer & Beber',g:G.terra,st:'been',r:5,nota:'Oito mesas, polvo à lagareiro. Reserva ou desiste.'}]}]},
  {id:'hr',pais:'Croácia',bd:'🇭🇷',reg:'Europa',g:G.mar,cidades:[
    {nome:'Split',g:G.mar,spots:[
      {n:'Konoba Matejuska',c:'Comer & Beber',g:G.terra,st:'been',r:5,nota:'Peixe do dia grelhado, o dono escolhe por você e acerta. Não tem cardápio de verdade.'},
      {n:'Hotel Park Split',c:'Onde ficar',g:G.verdeM,st:'been',r:4,nota:'Dez minutos do centro a pé, varanda pro mar. Café da manhã fraco, o resto compensa.'},
      {n:'Passeio a Hvar',c:'Experiência',g:G.mar,st:'been',r:5,nota:'Sai cedo de barco. A água muda de cor três vezes no caminho.'}]}]},
  {id:'it',pais:'Itália',bd:'🇮🇹',reg:'Europa',g:G.ouro,cidades:[
    {nome:'Modena',g:G.ouro,spots:[
      {n:'Osteria Francescana',c:'Comer & Beber',g:G.vinho,st:'want',r:0,nota:'A reserva abre com meses. Um dia.'},
      {n:'Mercato Albinelli',c:'Compras',g:G.ouro,st:'been',r:4,nota:'Vai de manhã. Compra o aceto velho, não o de supermercado.'}]}]},
  {id:'jp',pais:'Japão',bd:'🇯🇵',reg:'Ásia',g:G.vinho,cidades:[
    {nome:'Tóquio',g:G.vinho,spots:[
      {n:'Ichiran Shibuya',c:'Comer & Beber',g:G.terra,st:'been',r:5,nota:'Cabine individual, você marca tudo num papel. Comi sozinha e foi perfeito.',com:[['BC','#2F5D62']]},
      {n:'teamLab Planets',c:'Experiência',g:G.mar,st:'been',r:4,nota:'Descalço, com água até o joelho. Vai de manhã cedo ou é fila de duas horas.'}]},
    {nome:'Quioto',g:G.verdeM,spots:[
      {n:'Fushimi Inari',c:'Experiência',g:G.terra,st:'been',r:5,nota:'Chega às 6h. Às 8h já não é o mesmo lugar.'},
      {n:'Nishiki Market',c:'Comer & Beber',g:G.ouro,st:'been',r:4,nota:'Café da manhã andando. Prova o tamagoyaki na banca do meio.'}]}]},
  {id:'pe',pais:'Peru',bd:'🇵🇪',reg:'Am. do Sul',g:G.verdeM,cidades:[
    {nome:'Lima',g:G.verdeM,spots:[
      {n:'Central',c:'Comer & Beber',g:G.vinho,st:'been',r:5,nota:'Menu por altitude, do mar aos Andes. Caro e vale cada centavo.'},
      {n:'Barranco a pé',c:'Experiência',g:G.terra,st:'been',r:4,nota:'Vai no fim da tarde, quando o mar fica laranja.'}]}]}
];
const FEED=[
  {tipo:'visita',quem:'Marina',ini:'MC',cor:'#2F5D62',quando:'há 2 h',lugar:'Cervejaria Ramiro',cat:'Comer & Beber · Lisboa 🇵🇹',g:G.terra,r:5,nota:'Fui por causa da sua nota. A fila valeu, o camarão vale mais.',alt:186},
  {tipo:'visita',quem:'Théo',ini:'TV',cor:'#6b5535',quando:'ontem',lugar:'Fushimi Inari',cat:'Natureza · Quioto 🇯🇵',g:G.mar,r:4,nota:'Chega às 6h. Às 8h já não é o mesmo lugar. Tinha razão.',alt:130},
  {tipo:'coment',quem:'Bea',ini:'BC',cor:'#8a3d4a',lugar:'Bar do Mineiro',texto:'Pastel de feijão às 11h da manhã. Sem culpa.'},
  {tipo:'visita',quem:'Gabriel',ini:'GB',cor:'#4c7a52',quando:'3 dias',lugar:'Konoba Matejuska',cat:'Comer & Beber · Split 🇭🇷',g:G.verdeM,r:5,nota:'Sem cardápio, o dono escolheu. Melhor peixe da viagem inteira.',alt:130}
];
const NAV=[
  ['viagens','Viagens','M9 20l-6-3V4l6 3m0 13l6-3m-6 3V7m6 10l6 3V7l-6-3m0 13V4'],
  ['explorar','Explorar','CIRC'],
  ['amigos','Amigos','PESSOAS'],
  ['perfil','Perfil','PESSOA']
];
const ICONES={
  CIRC:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  PESSOAS:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.5a3 3 0 010 5.5M18 20c0-2.6-1-4.2-2.5-5"/>',
  PESSOA:'<circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"/>'
};
const S={reg:'Europa',viagem:null,cidade:null,spot:null,cat:'Todos',aba:'Recente',pilha:[],salvos:{}};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let tmToast;
function toast(t){const a=$('aviso');a.textContent=t;a.classList.add('on');clearTimeout(tmToast);tmToast=setTimeout(()=>a.classList.remove('on'),2100)}

function ir(tela,guardar){
  if(guardar!==false){const atual=document.querySelector('.tela.on');if(atual)S.pilha.push(atual.id)}
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('on'));
  $(tela).classList.add('on');
  const raiz=['viagens','explorar','amigos','perfil'].includes(tela);
  $('nav').style.display=raiz?'flex':'none';
  $('aviso').classList.remove('on');
  document.querySelectorAll('.rola,.sp-rola').forEach(r=>r.scrollTop=0);
  if(raiz)pintarNav(tela);
}
function voltar(){const a=S.pilha.pop()||'viagens';ir(a,false)}

function pintarNav(ativa){
  $('nav').innerHTML=NAV.map(([id,rot,d])=>{
    const corpo=ICONES[d]||('<path d="'+d+'"/>');
    return '<button class="nav-i'+(id===ativa?' on':'')+'" onclick="irRaiz(\''+id+'\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+corpo+'</svg><span>'+rot+'</span></button>';
  }).join('');
}
function irRaiz(id){S.pilha=[];ir(id,false)}

// ── Viagens ──
function regioes(){const r=[];VIAGENS.forEach(v=>{if(!r.includes(v.reg))r.push(v.reg)});return r}
function daRegiao(){return VIAGENS.filter(v=>v.reg===S.reg)}
function pintarViagens(){
  let sp=0,cd=0;
  VIAGENS.forEach(v=>v.cidades.forEach(c=>{cd++;sp+=c.spots.length}));
  $('nSpots').textContent=sp+' spots';$('nCid').textContent=cd+' cidades';
  $('chips').innerHTML=regioes().map(r=>{
    const n=VIAGENS.filter(v=>v.reg===r).length;
    return '<button class="chip'+(r===S.reg?' on':'')+'" onclick="trocarRegiao(\''+esc(r)+'\')">'+esc(r)+' · '+n+'</button>';
  }).join('');
  const lista=daRegiao();
  $('filme').innerHTML=lista.map((v,i)=>{
    const nc=v.cidades.length, ns=v.cidades.reduce((a,c)=>a+c.spots.length,0);
    return '<button class="card" onclick="abrirViagem(\''+v.id+'\')"><div class="g" style="background:'+v.g+'"></div><div class="s"></div><div class="bd">'+v.bd+'</div><div class="pe"><h3>'+esc(v.pais)+'</h3><p>'+nc+(nc===1?' cidade':' cidades')+' · '+ns+' spots</p></div></button>';
  }).join('');
  $('pag').innerHTML=lista.map((_,i)=>'<i class="'+(i===0?'on':'')+'"></i>').join('');
  $('filme').onscroll=()=>{
    const i=Math.round($('filme').scrollLeft/262);
    [...$('pag').children].forEach((el,j)=>el.classList.toggle('on',j===i));
  };
}
function trocarRegiao(r){S.reg=r;pintarViagens();$('filme').scrollLeft=0}

// ── Viagem ──
function abrirViagem(id){
  const v=VIAGENS.find(x=>x.id===id);S.viagem=v;
  $('vgHero').style.background=v.g;
  $('vgK').textContent=v.bd+'  '+v.reg;
  $('vgNome').textContent=v.pais;
  $('vgCidades').innerHTML=v.cidades.map((c,i)=>{
    const por={};c.spots.forEach(s=>por[s.c]=(por[s.c]||0)+1);
    const quebra=Object.keys(por).map(k=>esc(k)+' '+por[k]).join('  ·  ');
    return '<button class="cid" onclick="abrirCidade('+i+')"><h4>'+esc(c.nome)+'</h4><div class="m"><span>'+quebra+'</span></div></button>';
  }).join('');
  ir('viagem');
}

// ── Cidade ──
function abrirCidade(i){
  const c=S.viagem.cidades[i];S.cidade=c;S.cat='Todos';
  $('cdHero').style.background=c.g;
  $('cdK').textContent=S.viagem.bd+'  '+esc(S.viagem.pais);
  $('cdNome').textContent=c.nome;
  pintarCidade();
  ir('cidade');
}
function pintarCidade(){
  const c=S.cidade;
  const usadas=['Todos'].concat(CATS.slice(1).filter(k=>c.spots.some(s=>s.c===k)));
  $('cdAbas').innerHTML=usadas.map(k=>'<button class="catab'+(k===S.cat?' on':'')+'" onclick="trocarCat(\''+esc(k)+'\')">'+esc(k)+'</button>').join('');
  const lista=S.cat==='Todos'?c.spots:c.spots.filter(s=>s.c===S.cat);
  $('cdLista').innerHTML=lista.map(s=>{
    const j=c.spots.indexOf(s);
    return '<button class="linha" onclick="abrirSpot('+j+')"><div class="th" style="background:'+s.g+'"></div><div class="co"><div class="k">'+esc(s.c)+'</div><h4>'+esc(s.n)+'</h4><q>'+esc(s.nota)+'</q></div></button>';
  }).join('')||'<div class="vazio" style="padding:40px 0">Nada nessa categoria ainda.</div>';
}
function trocarCat(k){S.cat=k;pintarCidade()}

// ── Spot ──
const ROT={been:'Fui',want:'Quero ir',skip:'Pular'};
function abrirSpot(i){S.spot=S.cidade.spots[i];pintarSpot();ir('spot')}
function pintarSpot(){
  const s=S.spot;
  $('spFoto').style.background=s.g;
  $('spK').textContent=s.c+' · '+S.cidade.nome;
  $('spNome').textContent=s.n;
  $('spNota').textContent='“'+s.nota+'”';
  const chip=$('spChip');
  chip.textContent=ROT[s.st];
  chip.className='st-chip st-'+s.st;
  $('spSeg').innerHTML=['want','been','skip'].map(k=>{
    const cor=k==='been'?'var(--verdeTxt)':k==='want'?'#DDCBA4':'var(--ink)';
    return '<button class="'+(s.st===k?'on':'')+'" style="'+(s.st===k?'color:'+cor:'')+'" onclick="porStatus(\''+k+'\')">'+ROT[k]+'</button>';
  }).join('');
  $('spEstrelas').innerHTML=[1,2,3,4,5].map(n=>{
    const cheia=n<=s.r;
    return '<button onclick="avaliar('+n+')"><svg width="22" height="22" viewBox="0 0 24 24" '+(cheia?'fill="#BFA474"':'fill="none" stroke="rgba(234,231,224,.3)" stroke-width="1.6" stroke-linejoin="round"')+'><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/></svg></button>';
  }).join('');
  const com=s.com||[];
  $('spSocial').innerHTML=com.length
    ? '<div class="pilha">'+com.map(([ini,cor])=>'<b style="background:'+cor+'">'+ini+'</b>').join('')+'</div><p>'+com.map(c=>'<i>'+({MC:'Marina',TV:'Théo',BC:'Bea',GB:'Gabriel'}[c[0]]||'Alguém')+'</i>').join(' e ')+' comentaram</p><u>Google 4,6 ★</u>'
    : '<p style="color:var(--ink3)">Ninguém comentou ainda</p><u>Google 4,6 ★</u>';
}
function porStatus(k){S.spot.st=k;pintarSpot();toast('Marcado como "'+ROT[k]+'"')}
function ciclarStatus(){const o=['want','been','skip'];porStatus(o[(o.indexOf(S.spot.st)+1)%3])}
function avaliar(n){S.spot.r=(S.spot.r===n?0:n);pintarSpot()}

// ── Amigos ──
function pintarAmigos(){
  $('amAbas').innerHTML=['Recente','Amigos','Pedidos'].map(a=>
    '<button class="'+(a===S.aba?'on':'')+'" onclick="trocarAba(\''+a+'\')">'+a+(a==='Pedidos'?' <span class="badge">2</span>':'')+'</button>').join('');
  if(S.aba!=='Recente'){
    $('amFeed').innerHTML='<div class="vazio">'+S.aba+'<br><span style="font-size:12.5px">Fora do escopo deste protótipo.</span></div>';
    return;
  }
  $('amFeed').innerHTML=FEED.map((f,i)=>{
    if(f.tipo==='coment'){
      return '<button class="fcoment" onclick="toast(\'Abre o spot comentado\')"><b style="background:'+f.cor+'">'+f.ini+'</b><p><i>'+esc(f.quem)+'</i> comentou em <i>'+esc(f.lugar)+'</i>: “'+esc(f.texto)+'”</p></button>';
    }
    const est=[1,2,3,4,5].map(n=>'<svg width="14" height="14" viewBox="0 0 24 24" '+(n<=f.r?'fill="#BFA474"':'fill="none" stroke="rgba(234,231,224,.3)" stroke-width="1.6" stroke-linejoin="round"')+'><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/></svg>').join('');
    const salvo=S.salvos[i];
    return '<div class="fcard"><div class="im" style="height:'+f.alt+'px"><div class="g" style="background:'+f.g+'"></div>'
      +'<div class="quem"><b style="background:'+f.cor+'">'+f.ini+'</b><span><i>'+esc(f.quem)+'</i> foi</span></div>'
      +'<div class="quando">'+esc(f.quando)+'</div>'
      +'<div class="pe"><span>'+esc(f.cat)+'</span><h3>'+esc(f.lugar)+'</h3></div></div>'
      +'<div class="fcorpo"><q>'+esc(f.nota)+'</q><div class="flinha"><div class="estrelas">'+est+'</div>'
      +'<button class="salvar'+(salvo?' feito':'')+'" onclick="salvar('+i+')">'+(salvo?'na sua lista':'+ minha lista')+'</button></div></div></div>';
  }).join('');
}
function trocarAba(a){S.aba=a;pintarAmigos()}
function salvar(i){
  if(S.salvos[i])return;
  S.salvos[i]=true;pintarAmigos();
  toast('Salvo. No app real vai direto, sem perguntar nada.');
}

pintarNav('viagens');
pintarViagens();
pintarAmigos();
</script>
</body>
</html>
