<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Abrir o Spot no Expo Go</title>
<!--
  PÁGINA TEMPORÁRIA DE DESENVOLVIMENTO — pode apagar.

  Existe por um motivo chato: o app Câmera do iPhone recusa QR code com
  endereço exp:// ("nenhum dado usável"), mas o Safari ABRE o mesmo endereço
  quando ele vem como link tocável numa página. Então o QR aponta pra cá, e
  daqui o toque leva pro Expo Go.

  O endereço do servidor muda a cada vez que ele sobe. Editar a constante
  ENDERECO abaixo e publicar de novo.
-->
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;
    background:#0b1620;color:#EAE7E0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center}
  .caixa{max-width:380px}
  h1{font-size:23px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
  p{color:#879499;font-size:15px;line-height:1.55;margin:0 0 26px}
  a.botao{display:block;background:#c1552f;color:#fff;text-decoration:none;
    font-size:17px;font-weight:600;padding:17px 22px;border-radius:14px;
    min-height:52px;box-sizing:border-box}
  a.botao:active{opacity:.85}
  .end{margin-top:22px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
    color:#5A696E;word-break:break-all;line-height:1.6}
  .obs{margin-top:20px;font-size:13px;color:#879499;line-height:1.5}
</style>
</head>
<body>
<div class="caixa">
  <h1>Abrir o Spot no Expo Go</h1>
  <p>Toca no botão. O iPhone vai perguntar se pode abrir o Expo Go — responde que sim.</p>

  <a class="botao" id="ir" href="#">Abrir no Expo Go</a>

  <div class="obs">Se não acontecer nada, o Expo Go não está instalado.
    Instala pela App Store e volta aqui.</div>

  <div class="end" id="end"></div>
</div>
<script>
  // Trocar a cada vez que o servidor de desenvolvimento sobe.
  var ENDERECO = 'exp://obs4vda-anonymous-8081.exp.direct';
  document.getElementById('ir').href = ENDERECO;
  document.getElementById('end').textContent = ENDERECO;
</script>
</body>
</html>
